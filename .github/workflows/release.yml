name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests and syntax checks
        run: |
          python -m unittest discover -s tests -v
          python -m py_compile main.py core/*.py ui/*.py
          for script in scripts/*.sh install.sh flatpak/build.sh; do
            bash -n "$script"
          done

  build-flatpak:
    name: Build and publish Flatpak
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flatpak build tools and SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --system --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system --noninteractive -y flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build Flatpak bundle
        run: bash flatpak/build.sh

      - name: Create checksum
        run: sha256sum linuxutil-studio.flatpak > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "LinuxUtil Studio ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            linuxutil-studio.flatpak SHA256SUMS
