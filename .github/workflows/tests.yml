name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: unittest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Catalogue and resolution tests
        run: python -m unittest discover -s tests -v

      - name: Python syntax check
        run: python -m py_compile main.py core/*.py ui/*.py

      - name: Bash syntax check
        run: |
          for script in scripts/*.sh install.sh flatpak/build.sh; do
            bash -n "$script"
            echo "ok $script"
          done

  clean-install:
    name: clean install (from source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt

      - name: CLI smoke tests
        run: |
          .venv/bin/python main.py --info
          .venv/bin/python main.py --list
          .venv/bin/python main.py --install htop --dry-run
