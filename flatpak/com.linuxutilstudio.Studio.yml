app-id: com.linuxutilstudio.Studio
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: linuxutil-studio
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --share=network
  - --filesystem=home
  - --talk-name=org.freedesktop.Flatpak
modules:
  - name: python-deps
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=/app --no-index --find-links=. PySide6
    sources:
      - type: dir
        path: wheels
  - name: linuxutil-studio
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/linuxutil-studio
      - cp -r core ui assets catalogue.json main.py /app/lib/linuxutil-studio/
      - install -Dm755 flatpak/run.sh /app/bin/linuxutil-studio
    sources:
      - type: dir
        path: ..