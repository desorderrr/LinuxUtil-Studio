<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">LinuxUtil Studio</title>
  <desc id="desc">Install your Linux essentials. Preview every command.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101b2f"/>
      <stop offset="1" stop-color="#0a101c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a84ff"/>
      <stop offset="1" stop-color="#4ec9b0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.15" r="0.65">
      <stop offset="0" stop-color="#0a84ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#4ec9b0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#4ec9b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="26" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="26" fill="url(#glowA)"/>
  <rect width="1280" height="320" rx="26" fill="url(#glowB)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- mark -->
  <rect x="72" y="100" width="104" height="104" rx="28" fill="url(#mark)"/>
  <rect x="72" y="100" width="104" height="104" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <path d="M100 139l17 13-17 13" fill="none" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 165h16" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="208" y="156" fill="#f2f6fc" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="50" font-weight="700" letter-spacing="-1">LinuxUtil Studio</text>
  <text x="210" y="194" fill="#9fb0c8" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="20">Install your Linux essentials. Preview every command.</text>

  <!-- chips -->
  <g font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600">
    <rect x="208" y="220" width="190" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"
          stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="303" y="242" fill="#cfe0f7" text-anchor="middle">55 apps · 9 categories</text>

    <rect x="410" y="220" width="264" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"
          stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="542" y="242" fill="#cfe0f7" text-anchor="middle">apt · dnf · pacman · zypper</text>

    <rect x="686" y="220" width="156" height="34" rx="17" fill="#ffffff" fill-opacity="0.06"
          stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="764" y="242" fill="#cfe0f7" text-anchor="middle">Flatpak &amp; Snap</text>
  </g>

  <!-- mini terminal -->
  <g>
    <rect x="876" y="78" width="336" height="160" rx="14" fill="#0d1420" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="898" cy="100" r="5" fill="#ff5f57"/>
    <circle cx="916" cy="100" r="5" fill="#febc2e"/>
    <circle cx="934" cy="100" r="5" fill="#28c840"/>
    <path d="M876 118h336" stroke="#ffffff" stroke-opacity="0.08"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="14">
      <text x="898" y="148" fill="#4ec9b0">$</text>
      <text x="914" y="148" fill="#dbe6f5">sudo dnf install htop</text>

      <text x="898" y="174" fill="#6f8098">resolving dependencies...</text>

      <text x="898" y="202" fill="#4ec9b0">✓</text>
      <text x="916" y="202" fill="#dbe6f5">htop installed</text>

      <text x="898" y="224" fill="#6f8098" font-size="12.5">log streamed to the console</text>
    </g>
  </g>

  <!-- footer line -->
  <path d="M72 258v0" stroke="none"/>
  <text x="1208" y="292" fill="#5f7189" text-anchor="end"
        font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5">
    MIT · built with Python &amp; PySide6
  </text>
</svg>
